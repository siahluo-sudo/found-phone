<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#171923"><title>拾起的手機｜互動故事</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#fff;background:#11131b}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 20% 15%,#3b3e62,#11131b 70%)}button{font:inherit;cursor:pointer}.phone{width:min(100vw,410px);height:min(100dvh,850px);position:relative;overflow:hidden;background:#171b2a;box-shadow:0 25px 90px #0009;border:7px solid #090a10;border-radius:38px}.wallpaper{background:linear-gradient(155deg,#11152e,#50416a 55%,#b26e86)}.screen{position:absolute;inset:0;display:flex;flex-direction:column}.hidden{display:none!important}.status{height:42px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:11px 26px 0;font-size:13px;font-weight:700;z-index:2}.island{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:104px;height:25px;border-radius:20px;background:#090a10;z-index:4}.bottom{height:25px;flex-shrink:0;display:grid;place-items:center;z-index:4}.bar{height:5px;width:112px;border-radius:6px;background:#fff9}.lock-main{flex:1;text-align:center;padding-top:65px}.clock{font-size:78px;font-weight:200;letter-spacing:-4px}.date{font-size:17px}.notification{margin:24px 20px;background:#ffffff35;backdrop-filter:blur(15px);padding:16px;border-radius:16px;text-align:left;font-size:14px}.unlock{background:#ffffff25;color:#fff;border:1px solid #fff6;border-radius:22px;padding:13px 24px;margin-top:14px}.home-main{flex:1;padding:45px 20px 0}.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 10px}.app{border:0;background:none;color:#fff;display:flex;align-items:center;flex-direction:column;gap:6px;font-size:12px}.app-icon{width:59px;height:59px;display:grid;place-items:center;border-radius:16px;font-size:29px;box-shadow:0 5px 14px #0003}.dock{margin:0 18px 18px;padding:13px;display:flex;justify-content:space-around;border-radius:24px;background:#ffffff30}.app-screen{background:#f6f6fa;color:#151620}.header{height:56px;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid #ddd;background:#fff}.back{border:0;background:none;color:#386bd0;font-size:25px}.heading{font-weight:700;font-size:19px}.content{flex:1;overflow-y:auto;padding:16px}.thread{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;border-bottom:1px solid #e6e6e6;background:transparent;text-align:left;padding:16px 4px;color:#222}.muted{color:#81818b;font-size:12px}.chat-body{display:flex;flex-direction:column;gap:12px}.bubble{max-width:82%;padding:11px 14px;border-radius:17px;background:#e5e5eb;line-height:1.55;white-space:pre-wrap;font-size:15px;align-self:flex-start}.mine{background:#4384eb;color:#fff;align-self:flex-end}.choices{display:flex;flex-direction:column;gap:9px;padding:12px 16px;background:#fff;border-top:1px solid #eee}.choice{border:1px solid #8aa9ed;color:#3265b7;background:#f4f8ff;padding:12px;border-radius:12px;text-align:left}.choice:disabled{opacity:.5}.tile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile{aspect-ratio:1;border:0;border-radius:8px;font-size:35px;background:linear-gradient(145deg,#c9bfdc,#7f99c1)}.note{background:#fff;border-radius:14px;padding:18px;margin-bottom:12px;line-height:1.7;box-shadow:0 1px 4px #0001}.note h3{margin:0 0 7px}.modal{position:absolute;inset:0;background:#000d;display:grid;place-items:center;z-index:6;padding:22px}.modal-inner{width:100%;background:white;color:#222;border-radius:20px;padding:24px;text-align:center}.modal button{border:0;border-radius:12px;background:#345fd5;color:#fff;padding:12px 20px}.settings{margin-top:auto;text-align:center;padding:20px}.settings button{border:1px solid #fff7;color:white;background:#0003;padding:8px 12px;border-radius:12px}.footnote{font-size:11px;color:#ddd9;text-align:center;margin-top:10px}@media(max-width:450px){.phone{border:0;border-radius:0;height:100dvh;width:100vw}.island{top:5px}}@media(min-width:451px){body{padding:16px}}
</style></head><body><div class="phone" id="phone"><div class="island"></div><div id="lock" class="screen wallpaper"><div class="status"><span id="lockSmallTime">09:41</span><span>●●● ▰</span></div><div class="lock-main"><div class="date" id="lockDate"></div><div class="clock" id="lockTime">09:41</div><div class="notification">📩 <b>未知號碼</b><div style="margin-top:7px">你真的不記得昨晚發生什麼事了嗎？</div></div><button class="unlock" id="unlock">向上滑動解鎖 ↑</button></div><div class="bottom"><div class="bar"></div></div></div><div id="home" class="screen wallpaper hidden"><div class="status"><span class="now">09:41</span><span>●●● ▰</span></div><div class="home-main"><div class="app-grid" id="apps"></div></div><div class="dock"><button class="app" data-app="messages"><span class="app-icon" style="background:#37bf70">💬</span>訊息</button><button class="app" data-app="calls"><span class="app-icon" style="background:#3bbd6c">☎️</span>電話</button></div><div class="settings"><button id="reset">重置故事</button><div class="footnote">虛構故事 · 本機儲存進度</div></div><div class="bottom"><div class="bar"></div></div></div><div id="app" class="screen app-screen hidden"><div class="status" style="color:#111;background:white"><span class="now">09:41</span><span>●●● ▰</span></div><div class="header"><button class="back" id="back">‹</button><div class="heading" id="appTitle">訊息</div></div><div class="content" id="content"></div><div id="choices" class="choices hidden"></div><div class="bottom" style="background:white"><div class="bar" style="background:#333"></div></div></div><div class="modal hidden" id="modal"><div class="modal-inner"><div id="modalText"></div><p><button id="closeModal">關閉</button></p></div></div></div><script>
'use strict';const KEY='found-phone-v01';const initial={stage:0,unlocked:false};let state;try{state={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state={...initial}};const $=id=>document.getElementById(id);const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const show=id=>{for(const name of ['lock','home','app'])$(name).classList.toggle('hidden',name!==id)};const time=()=>new Intl.DateTimeFormat('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());const updateClock=()=>{const t=time();$('lockTime').textContent=t;$('lockSmallTime').textContent=t;document.querySelectorAll('.now').forEach(e=>e.textContent=t);$('lockDate').textContent=new Intl.DateTimeFormat('zh-TW',{month:'long',day:'numeric',weekday:'long'}).format(new Date())};updateClock();setInterval(updateClock,30000);
const apps=[['messages','訊息','💬','#39bf6e'],['photos','相簿','🌄','#e6c4cb'],['notes','備忘錄','📝','#f0c953'],['calls','電話','☎️','#38bd6c']];$('apps').innerHTML=apps.map(([id,label,emoji,color])=>`<button class="app" data-app="${id}"><span class="app-icon" style="background:${color}">${emoji}</span>${label}</button>`).join('');$('unlock').onclick=()=>{state.unlocked=true;save();show('home')};let startY=0;$('lock').addEventListener('touchstart',e=>startY=e.touches[0].clientY,{passive:true});$('lock').addEventListener('touchend',e=>{if(startY-e.changedTouches[0].clientY>60)$('unlock').click()},{passive:true});$('back').onclick=()=>show('home');document.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>openApp(b.dataset.app));$('reset').onclick=()=>{if(confirm('確定重置故事進度嗎？')){state={...initial};save();show('lock')}};
const modal=text=>{$('modalText').textContent=text;$('modal').classList.remove('hidden')};$('closeModal').onclick=()=>$('modal').classList.add('hidden');const make=(tag,cls,text)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el};function openApp(id){show('app');$('choices').classList.add('hidden');$('content').replaceChildren();const title={messages:'訊息',photos:'相簿',notes:'備忘錄',calls:'通話紀錄'}[id];$('appTitle').textContent=title;if(id==='messages')messages();if(id==='photos')photos();if(id==='notes')notes();if(id==='calls')calls()}
function messages(){const c=$('content');const people=[['林沐','你到家了嗎？'],['未知號碼','你真的不記得昨晚發生什麼事了嗎？']];people.forEach(([name,preview])=>{const b=make('button','thread');const wrap=make('div');wrap.append(make('div','',name),make('div','muted',preview));b.append(wrap,make('span','muted','›'));b.onclick=()=>chat(name);c.append(b)})}
function chat(name){$('appTitle').textContent=name;const c=$('content');c.replaceChildren();$('choices').replaceChildren();$('choices').classList.add('hidden');const body=make('div','chat-body');c.append(body);const add=(txt,mine=false)=>body.append(make('div','bubble'+(mine?' mine':''),txt));if(name==='林沐'){add('你到家了嗎？');add('如果看到我的訊息，回我一下。');return}add('你真的不記得昨晚發生什麼事了嗎？');if(state.stage>=1){add(state.stage===1?'你是誰？':'我找到手機了，這是誰的？',true);add('先去看看備忘錄裡的「星期五」。');}if(state.stage>=2){add('我會去看看。',true);add('照片也許能幫你想起來。');}if(state.stage>=3){add('我看到照片了。',true);add('故事才剛開始。下一個版本見。');}const choices=$('choices');if(state.stage===0){addChoice('你是誰？',()=>advance(1));addChoice('我找到手機了，這是誰的？',()=>advance(1))}else if(state.stage===1){addChoice('我會去看看備忘錄。',()=>advance(2))}else if(state.stage===2){addChoice('我看完備忘錄了，照片在哪？',()=>advance(3))}choices.classList.toggle('hidden',!choices.children.length);c.scrollTop=c.scrollHeight;function addChoice(label,action){const b=make('button','choice',label);b.onclick=action;choices.append(b)}function advance(n){state.stage=n;save();chat(name)}}
function photos(){const c=$('content');c.append(make('p','muted','最近項目 · 3 張照片'));const grid=make('div','tile-grid');[['🌃','昨晚 23:47，街角的路燈。'],['☕','兩杯咖啡，桌上留著一張紙條。'],['🚪','一扇沒有門牌的藍色門。']].forEach(([emoji,desc])=>{const b=make('button','tile',emoji);b.onclick=()=>modal(desc);grid.append(b)});c.append(grid);if(state.stage>=2)c.append(make('p','muted','線索：藍色的門，似乎和備忘錄有關。'))}
function notes(){const c=$('content');const note=make('div','note');note.append(make('h3','','星期五'),make('div','','不要忘記：23:40、藍色的門、第二杯咖啡。\n如果我不記得，就先查看相簿。'));c.append(note);const note2=make('div','note');note2.append(make('h3','','購物清單'),make('div','','牛奶、麵包、電池'));c.append(note2)}
function calls(){const c=$('content');[['林沐','昨天 22:14 · 未接來電'],['未知號碼','昨天 23:52 · 來電']].forEach(([name,desc])=>{const b=make('button','thread');const wrap=make('div');wrap.append(make('div','',name),make('div','muted',desc));b.append(wrap,make('span','','ⓘ'));b.onclick=()=>modal('這是示範通話紀錄，暫時無法回撥。');c.append(b)})}
show(state.unlocked?'home':'lock');
</script></body></html>
