const modal=text=>{$('modalText').textContent=text;$('modal').classList.remove('hidden')};$('closeModal').onclick=()=>$('modal').classList.add('hidden');const make=(tag,cls,text)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el};function openApp(id){activeChat=null;if(state.chatTyping){clearTimeout(chatTimer);if(pendingReply?.id===state.chatTyping)addMessage(pendingReply.id,'them',pendingReply.text);pendingReply=null;state.chatTyping=null;save()}clearTimeout(chatTimer);$('app').classList.remove('chat-app','chat-room');$('content').className='content';show('app');$('choices').classList.add('hidden');$('content').replaceChildren();const title={messages:'訊息',photos:'相簿',notes:'備忘錄',calls:'通話紀錄'}[id];$('appTitle').textContent=title;if(id==='messages')messages();if(id==='photos')photos();if(id==='notes')notes();if(id==='calls')calls()}

function renderChat(){if(!activeChat)return;const id=activeChat,p=CHAT_PEOPLE[id],c=$('content');c.replaceChildren();const body=make('div','chat-body');body.append(make('div','chat-day','今天'));c.append(body);for(const msg of getChatData()[id]){const mine=msg.from==='me';const line=make('div','chat-line chat-animate'+(mine?' mine-line':''));if(!mine){const av=make('span','avatar small',p.avatar);av.style.background=p.color;line.append(av)}const wrap=make('div');if(!mine)wrap.append(make('div','chat-person',p.name));const row=make('div','chat-msg-row');row.append(make('div','bubble'+(mine?' mine':''),msg.text));const meta=make('div','chat-meta');if(mine)meta.append(make('span','read',''));meta.append(make('span','',msg.time||''));row.append(meta);wrap.append(row);line.append(wrap);body.append(line)}if(state.chatTyping===id){const t=make('div','chat-line');const av=make('span','avatar small',p.avatar);av.style.background=p.color;const bubble=make('div','typing');for(let i=0;i<3;i++)bubble.append(make('i'));t.append(av,bubble);body.append(t)}c.scrollTop=c.scrollHeight;renderChoices()}
function renderChoices(){const choices=$('choices');choices.replaceChildren();if(!activeChat||state.chatTyping){choices.classList.add('hidden');return}const id=activeChat;if(id==='unknown'){
 if(state.stage===0){addChoice('你是誰？',()=>respond('你是誰？',1,'先別管我是誰。去看看備忘錄裡的「星期五」。'));addChoice('我找到這支手機了，這是誰的？',()=>respond('我找到這支手機了，這是誰的？',1,'這支手機裡有你需要知道的事。先看看備忘錄裡的「星期五」。'))}
 else if(state.stage===1){addChoice('我會去看看備忘錄。',()=>respond('我會去看看備忘錄。',2,'照片也許能幫你想起來。'))}
 else if(state.stage===2){addChoice('我看完備忘錄了，照片在哪？',()=>respond('我看完備忘錄了，照片在哪？',3,'打開相簿，看看那扇藍色的門。'))}
 else if(state.stage===3){addChoice('我看到照片了。',()=>respond('我看到照片了。',4,'很好。故事才剛開始……'))}
 }else if(id==='lin'&&!state.repliedLin){addChoice('我沒事，剛剛才看到。',()=>respond('我沒事，剛剛才看到。',null,'太好了，嚇死我了。', 'repliedLin'));addChoice('昨晚到底發生什麼事？',()=>respond('昨晚到底發生什麼事？',null,'你真的忘記了？先看看手機裡的東西。','repliedLin'))}
 else if(id==='yu'&&!state.repliedYu){addChoice('我還在找照片。',()=>respond('我還在找照片。',null,'好，找到再傳給我！','repliedYu'))}
 choices.classList.toggle('hidden',!choices.children.length)}
function addChoice(label,fn){const b=make('button','choice',label);b.onclick=fn;$('choices').append(b)}
function respond(text,stage,reply,flag){if(!activeChat||state.chatTyping)return;const id=activeChat;addMessage(id,'me',text);if(stage!==null)state.stage=stage;if(flag)state[flag]=true;state.chatTyping=id;pendingReply={id,text:reply};save();renderChat();chatTimer=setTimeout(()=>{state.chatTyping=null;pendingReply=null;addMessage(id,'them',reply);if(activeChat===id)renderChat()},1050)}
function chat(id){if(CHAT_PEOPLE[id]===undefined)return;clearTimeout(chatTimer);state.chatTyping=null;activeChat=id;seedChats();if(id==='unknown')state.chatOpenedUnknown=true;save();$('app').classList.remove('chat-app');$('app').classList.add('chat-room');$('content').className='content';$('appTitle').textContent=CHAT_PEOPLE[id].name;renderChat()}
function exitChat(){clearTimeout(chatTimer);if(state.chatTyping){const id=state.chatTyping;state.chatTyping=null;addMessage(id,'them',pendingReply?.id===id?pendingReply.text:'剛才的訊息收到了，晚點再聊。');pendingReply=null;save()}activeChat=null;messages()}
function photos(){const c=$('content');c.append(make('p','muted','最近項目 · 3 張照片'));const grid=make('div','tile-grid');[['🌃','昨晚 23:47，街角的路燈。'],['☕','兩杯咖啡，桌上留著一張紙條。'],['🚪','一扇沒有門牌的藍色門。']].forEach(([emoji,desc])=>{const b=make('button','tile',emoji);b.onclick=()=>modal(desc);grid.append(b)});c.append(grid);if(state.stage>=2)c.append(make('p','muted','線索：藍色的門，似乎和備忘錄有關。'))}
function notes(){const c=$('content');const note=make('div','note');note.append(make('h3','','星期五'),make('div','','不要忘記：23:40、藍色的門、第二杯咖啡。\n如果我不記得，就先查看相簿。'));c.append(note);const note2=make('div','note');note2.append(make('h3','','購物清單'),make('div','','牛奶、麵包、電池'));c.append(note2)}
function calls(){const c=$('content');[['林沐','昨天 22:14 · 未接來電'],['未知號碼','昨天 23:52 · 來電']].forEach(([name,desc])=>{const b=make('button','thread');const wrap=make('div');wrap.append(make('div','',name),make('div','muted',desc));b.append(wrap,make('span','','ⓘ'));b.onclick=()=>modal('這是示範通話紀錄，暫時無法回撥。');c.append(b)})}
show(state.unlocked?'home':'lock');
</script></body></html>
